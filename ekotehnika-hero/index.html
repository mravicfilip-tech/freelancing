<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekotehnika, Linde viljuškari</title>
    <!-- the live site's own icon, from ekotehnika.rs, unchanged -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/daxline/DaxlinePro-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/daxline/DaxlinePro-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist/geist-digits.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The still preloader sheet for the first paint, before the script has loaded. shell/Preloader.tsx takes its place on its first render and
         removes this, so the two must stay the same size, see .pl in shell/shell.css. A page that is not the story, a frozen shot (?at=) or
         a visitor with reduced motion never shows it. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9990;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        /* if the script never runs the sheet does not hide the page for good */
        animation: boot-gone 0s linear 15s forwards;
      }
      @keyframes boot-gone {
        to {
          visibility: hidden;
        }
      }
      #boot .pl-in {
        display: flex;
        flex-direction: column;
        gap: 48px;
        width: 350px;
      }
      #boot .pl-logos {
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #boot img {
        display: block;
        flex: none;
        width: 160px;
        height: auto;
      }
      #boot img:first-child {
        height: 96px;
      }
      #boot .pl-bar {
        height: 2px;
        background: rgb(34 34 34 / 0.12);
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="pl-in">
        <div class="pl-logos">
          <img src="/brand/linde-mh.svg" width="160" height="96" alt="" />
          <img src="/brand/ekotehnika.svg" width="160" height="33" alt="" />
        </div>
        <div class="pl-bar"></div>
      </div>
    </div>
    <script>
      if (/[?&](at|gate|servismap|story|story2|board)(=|&|$)/.test(location.search)) document.getElementById('boot').remove();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
