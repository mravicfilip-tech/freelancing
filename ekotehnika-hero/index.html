<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekotehnika, Linde viljuškari</title>
    <!-- the live site's own icon, from ekotehnika.rs, unchanged -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/daxline/DaxlinePro-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/daxline/DaxlinePro-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist/geist-digits.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The plain white sheet for the first paint, before the script has loaded. shell/Preloader.tsx takes its place on its first render and
         removes this, and the preloader version it draws starts from an empty white sheet too, so there is no jump. A page that is not the
         story, a frozen shot (?at=) or a visitor with reduced motion never shows it. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9990;
        background: #fff;
        /* if the script never runs the sheet does not hide the page for good */
        animation: boot-gone 0s linear 15s forwards;
      }
      @keyframes boot-gone {
        to {
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <script>
      if (/[?&](at|gate|servismap|story|story2|board)(=|&|$)/.test(location.search)) document.getElementById('boot').remove();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
