<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-ads" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ads"><title>Ads</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-ads .a{transform-origin:9px 12px;animation:ml-ad-a 1.5s cubic-bezier(.3,.7,.2,1) infinite}
.ml-ads .b,.ml-ads .c{animation:ml-ad-w 1.5s cubic-bezier(.3,.7,.2,1) infinite}
.ml-ads .c{animation-delay:.12s}
@keyframes ml-ad-a{0%,100%{transform:none}10%{transform:scale(.9)}24%{transform:none}}
@keyframes ml-ad-w{0%,8%{transform:translateX(-1.5px);opacity:0}30%,100%{transform:none;opacity:1}}</style><path d="M4 10v4a1 1 0 0 0 1 1h2l6 4V5L7 9H5a1 1 0 0 0-1 1z" class="a"/><path d="M7 15l1 4.5" class="a"/><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5" class="b"/><path d="M19 7a7 7 0 0 1 0 10" class="c"/></svg>
