<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-assistant" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Always-on assistant"><title>Always-on assistant</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-assistant .b,.ml-assistant .c{transform-box:fill-box;transform-origin:center;animation:ml-as-c 1.5s cubic-bezier(.3,.7,.2,1) infinite}
.ml-assistant .c{animation-delay:.1s}
.ml-assistant .d{stroke-dasharray:1;animation:ml-as-d 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes ml-as-c{0%,100%{transform:none}12%{transform:scale(1.15)}28%{transform:none}}
