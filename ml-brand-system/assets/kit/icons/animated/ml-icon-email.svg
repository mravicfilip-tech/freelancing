<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-email" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Email"><title>Email</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-email .a{animation:ml-em-a 3s cubic-bezier(.3,.7,.2,1) infinite}
.ml-email .d{stroke-dasharray:1;animation:ml-em-a 3s cubic-bezier(.3,.7,.2,1) infinite,ml-em-d 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes ml-em-a{0%{transform:translateX(-3px);opacity:0}20%,100%{transform:none;opacity:1}}
@keyframes ml-em-d{0%,16%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}</style><path d="M3.5 7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" class="a"/><path d="M4 7.5l8 5.5 8-5.5" class="a d" pathLength="1"/></svg>
