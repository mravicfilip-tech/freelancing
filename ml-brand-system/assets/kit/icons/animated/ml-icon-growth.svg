<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-growth" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Growth"><title>Growth</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-growth .d{stroke-dasharray:1;animation:ml-gr-d 3s cubic-bezier(.3,.7,.2,1) infinite}
.ml-growth .b{animation:ml-gr-b 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes ml-gr-d{0%,4%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
@keyframes ml-gr-b{0%,24%{transform:translate(-2px,2px);opacity:0}36%,100%{transform:none;opacity:1}}</style><path d="M3 17l5.5-5.5 4 4L20 8" class="d" pathLength="1"/><path d="M15 8h5v5" class="b"/></svg>
