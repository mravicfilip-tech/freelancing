<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-hours" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Hours back"><title>Hours back</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-hours .b{transform-origin:12px 12.5px;animation:ml-hr-b 3s cubic-bezier(.3,.7,.2,1) infinite}
.ml-hours .a{transform-origin:12px 12px;animation:ml-hr-a 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes ml-hr-b{0%{transform:none}50%,100%{transform:rotate(-360deg)}}
@keyframes ml-hr-a{0%,100%{transform:none}14%{transform:rotate(-18deg)}40%{transform:none}}</style><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5" class="a"/><path d="M4 3.5v5h5" class="a"/><path d="M12 8v4.5l3 2" class="b"/></svg>
