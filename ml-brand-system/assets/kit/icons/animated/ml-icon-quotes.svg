<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-quotes" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Quotes"><title>Quotes</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-quotes .b{transform-origin:9px 13px}
.ml-quotes .c{transform-origin:9px 17px}
.ml-quotes .b,.ml-quotes .c{animation:ml-qt 3s cubic-bezier(.3,.7,.2,1) infinite}
