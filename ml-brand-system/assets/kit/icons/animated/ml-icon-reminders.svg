<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-reminders" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Reminders"><title>Reminders</title><style>.ml-icon *{transform-box:view-box}
