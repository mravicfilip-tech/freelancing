<svg xmlns="http://www.w3.org/2000/svg" class="ml-icon ml-reporting" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Reporting"><title>Reporting</title><style>.ml-icon *{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.ml-icon *{animation:none!important}}
.ml-reporting .b{transform-origin:7.5px 16.5px}
.ml-reporting .c{transform-origin:11.25px 16.5px}
.ml-reporting .e{transform-origin:15px 16.5px}
