<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Light variant of trend-ring.svg. Geometry, ids, viewBox and
     preserveAspectRatio are byte for byte the original's; only paint differs.
     The 26px badge behind each card's trend arrow. #222223 on a paper card is a
     black hole punched in the corner of the card, which is what it looked like
     before this file existed. It becomes the raised panel tint instead, and the
     0.6px rim goes with it, so the badge still reads as a chip.
     No double hyphen may appear in this comment: it is illegal inside an XML
     comment, the file then fails to parse, and an <img> pointing at it shows a
     broken image rather than throwing. -->
<circle id="Ellipse 68" cx="13" cy="13" r="12.7" fill="#ece1d9" stroke="#d5c7bb" stroke-width="0.6"/>
</svg>
