<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="731.5" height="248.5" viewBox="0 0 731.5 248.5" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Light variant of dashed-path.svg. Geometry, ids, viewBox and
     preserveAspectRatio are byte for byte the original's; only paint differs.
     The three stop warm ramp inverts: deepest where it was palest. The
     stroke-opacity goes 0.37 to 0.55 because 37% of dark ink on paper is a fainter
     line than 37% of pale peach on near black, and this is the circuit the order
     travels. The path data is UNCHANGED: SlideFuture.motion.ts samples a verbatim
     copy of it to place the pulse frame by frame.
     No double hyphen may appear in this comment: it is illegal inside an XML
     comment, the file then fails to parse, and an <img> pointing at it shows a
     broken image rather than throwing. -->
