<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interaction fixture, defects</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #111; background: #fff; }
  /* Defect, translucent sticky header */
  header.top { position: sticky; top: 0; z-index: 30; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); }
  header.top a { color: #0b5; text-decoration: none; padding: 8px 12px; }
  header.top a:hover { color: #063; }
  .hero { height: 536px; background: #eef; padding: 24px; }
  /* Defect, z-index 999 content that paints over the header */
  .promo { position: relative; z-index: 999; height: 500px; background: #fde68a; padding: 24px; }
  .row { display: flex; gap: 16px; padding: 24px; }
  button { font: inherit; padding: 8px 16px; border: 1px solid #333; background: #fff; color: #111; cursor: pointer; }
  /* Defect, no hover state on .plain */
  /* Defect, hover that changes padding */
  .grow:hover { padding: 16px 32px; }
  .menu-wrap { position: relative; margin: 160px 24px 24px; width: 220px; }
  /* Defect, opens upward under the header, z-index lower than the header */
  .menu { position: absolute; bottom: 100%; left: 0; z-index: 5; width: 220px; height: 150px; background: #fff; border: 1px solid #333; }
  .menu[hidden] { display: none; }
  .clipbox { position: relative; overflow: hidden; height: 60px; width: 240px; margin: 120px 24px; border: 1px solid #999; }
  .clipbox .menu { top: 100%; bottom: auto; z-index: 5; }
  .tall { height: 1400px; }
</style>
</head>
<body>
<header class="top"><strong>Fixture</strong><a href="#a">Home</a><a href="#b">Docs</a></header>
<section class="hero">Hero</section>
<section class="promo">Promo block, z-index 999</section>
<div class="row">
  <button class="plain" type="button">No hover</button>
  <button class="grow" type="button">Grows</button>
</div>
<div class="menu-wrap">
  <button class="trigger" type="button" aria-haspopup="true" aria-expanded="false" id="t1">Open menu</button>
  <div class="menu" hidden id="m1"><button type="button" role="menuitem">One</button></div>
</div>
<div class="clipbox">
  <button class="trigger" type="button" aria-haspopup="true" aria-expanded="false" id="t2">Clipped menu</button>
  <div class="menu" hidden id="m2"><button type="button" role="menuitem">Two</button></div>
</div>
<div class="tall"></div>
<script>
  // Opens move focus into the menu. Escape closes without returning focus, which is a defect.
  for (const id of ['1', '2']) {
    const t = document.getElementById('t' + id), m = document.getElementById('m' + id);
    t.addEventListener('click', () => { m.hidden = false; t.setAttribute('aria-expanded', 'true'); m.querySelector('button').focus({ preventScroll: true }); });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    for (const id of ['1', '2']) { document.getElementById('m' + id).hidden = true; document.getElementById('t' + id).setAttribute('aria-expanded', 'false'); }
  });
</script>
</body>
</html>
