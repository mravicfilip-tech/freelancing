<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interaction fixture, clean</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #111; background: #fff; }
  header.top { position: sticky; top: 0; z-index: 30; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: #fff; border-bottom: 1px solid #ccc; }
  header.top a { color: #0b5; text-decoration: none; padding: 8px 12px; }
  header.top a:hover { color: #063; }
  .hero { height: 536px; background: #eef; padding: 24px; }
  .block { height: 500px; background: #fde68a; padding: 24px; }
  .row { display: flex; gap: 16px; padding: 24px; }
  button { font: inherit; padding: 8px 16px; border: 1px solid #333; background: #fff; color: #111; cursor: pointer; }
  button:hover { background: #111; color: #fff; }
  .menu-wrap { position: relative; margin: 160px 24px 24px; width: 220px; }
  .menu { position: absolute; top: 100%; left: 0; z-index: 40; width: 220px; height: 150px; background: #fff; border: 1px solid #333; }
  .menu[hidden] { display: none; }
  .tall { height: 1400px; }
</style>
</head>
<body>
<header class="top"><strong>Fixture</strong><a href="#a">Home</a><a href="#b">Docs</a></header>
<section class="hero">Hero</section>
<section class="block">Content</section>
<div class="row">
  <button type="button">First</button>
  <button type="button">Second</button>
</div>
<div class="menu-wrap">
  <button class="trigger" type="button" aria-haspopup="true" aria-expanded="false" id="t1">Open menu</button>
  <div class="menu" hidden id="m1"><button type="button" role="menuitem">One</button></div>
</div>
<div class="tall"></div>
<script>
  const t = document.getElementById('t1'), m = document.getElementById('m1');
  const close = () => { m.hidden = true; t.setAttribute('aria-expanded', 'false'); t.focus(); };
  t.addEventListener('click', () => { m.hidden = false; t.setAttribute('aria-expanded', 'true'); m.querySelector('button').focus({ preventScroll: true }); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !m.hidden) close(); });
</script>
</body>
</html>
