<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drifted fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; color: #1a1a1a; background: #ffffff; }
  h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  p { margin: 0 0 16px; }
  .small { font-size: 14px; line-height: 20px; color: #555555; }
  .card { width: 480px; padding: 24px; margin-bottom: 24px; background: #f4f6fa; border: 1px solid #d0d5dd; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
  .note { font-size: 13px; line-height: 20px; color: #555555; }
  .btn { display: inline-block; height: 40px; padding: 8px 24px; font: 500 16px/24px Arial, sans-serif; color: #ffffff; background: #e11d48; border: 0; border-radius: 6px; cursor: pointer; }
  .btn:hover { background: #1e3a8a; }
  .link { color: #1d4ed8; font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
  <h1>Fixture home</h1>
  <div class="card">
    <p>Body copy in the card.</p>
    <p class="small">Caption under the copy.</p>
    <p class="note">Fine print.</p>
    <button class="btn" id="primary">Continue</button>
  </div>
  <a class="link" href="#more">More details</a>
</body>
</html>
