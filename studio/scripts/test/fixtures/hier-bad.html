<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hierarchy fixture, bad</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #111; background: #fff; padding: 24px; }
  .banner { font-size: 48px; font-weight: 700; margin: 0 0 16px; }
  .fill { font: inherit; padding: 10px 20px; border: 0; background: #0b5; color: #fff; cursor: pointer; }
  .fill.blue { background: #1d4ed8; }
  .ghost { font: inherit; padding: 10px 20px; border: 1px solid #333; background: #fff; color: #111; cursor: pointer; }
  .icon { width: 40px; height: 40px; border: 1px solid #333; background: #fff; }
  section { margin: 24px 0; padding: 16px; border: 1px solid #ccc; }
  label { display: block; margin: 8px 0; }
</style>
</head>
<body>
<div class="banner">Welcome back</div>
<h1>Account</h1>
<section class="hero">
  <h3>Plans</h3>
  <button type="button" class="fill">Upgrade</button>
  <button type="button" class="fill blue">Compare</button>
  <button type="button" class="icon"><svg width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></button>
</section>
<form class="signup" action="#">
  <h2>Sign up</h2>
  <label>Email <input type="email" name="email"></label>
  <label>Name <input type="text" name="name"></label>
  <button type="submit" class="ghost">Send</button>
</form>
</body>
</html>
